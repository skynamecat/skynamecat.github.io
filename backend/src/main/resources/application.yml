spring:
  application:
    name: testproject-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/testproject}
    username: ${DB_USERNAME:testProject}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${BLINDBOX_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${BLINDBOX_MAX_UPLOAD_SIZE:50MB}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.skynamecat.testproject: INFO

blindbox:
  assets:
    directory: ${BLINDBOX_ASSET_DIRECTORY:./data/blindbox-assets}
    max-size-bytes: ${BLINDBOX_ASSET_MAX_BYTES:52428800}
    public-base-url: ${BLINDBOX_ASSET_PUBLIC_BASE_URL:/api/public/blindbox/assets}
    allowed-content-types:
      - model/gltf-binary
      - application/octet-stream
      - image/png
      - image/jpeg
      - image/webp
      - audio/mpeg
      - audio/wav
      - audio/x-wav
      - audio/ogg
      - application/json
