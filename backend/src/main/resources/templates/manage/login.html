<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 庞菠菠管理后台</title>
  <link rel="stylesheet" th:href="@{/manage/assets/manage.css}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">P</div>
    <p class="eyebrow">PANGBOBO ADMIN</p>
    <h1>庞菠菠管理后台</h1>
    <p class="muted">统一管理对话内容、访客问题与运行状态。</p>

    <div class="notice danger" th:if="${param.error}">账号或密码不正确，请重新输入。</div>
    <div class="notice success" th:if="${param.logout}">已经安全退出。</div>

    <form class="stack" th:action="@{/manage/login}" method="post">
      <label>
        <span>管理员账号</span>
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        <span>密码</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">进入管理后台</button>
    </form>
  </main>
</body>
</html>
