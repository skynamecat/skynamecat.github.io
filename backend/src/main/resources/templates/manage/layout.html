<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title th:text="${title + ' · skynamecat 管理台'}">skynamecat 管理台</title>
  <link rel="stylesheet" th:href="@{/manage/assets/manage.css}">
  <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"></script>
</head>
<body hx-boost="true">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" th:href="@{/manage}">
        <span class="brand-mark">S</span>
        <span><strong>skynamecat</strong><small>站点管理台</small></span>
      </a>
      <nav>
        <a th:href="@{/manage}" th:classappend="${active == 'dashboard'} ? ' active'">概览</a>
        <a th:href="@{/manage/intents}" th:classappend="${active == 'intents'} ? ' active'">意图与回答</a>
        <a th:href="@{/manage/unmatched}" th:classappend="${active == 'unmatched'} ? ' active'">未命中问题</a>
        <a th:href="@{/manage/requests}" th:classappend="${active == 'requests'} ? ' active'">请求记录</a>
      </nav>
      <form th:action="@{/manage/logout}" method="post">
        <button class="text-button" type="submit">退出登录</button>
      </form>
    </aside>
    <main class="main-content" id="main-content" th:insert="${content}"></main>
  </div>
</body>
</html>
